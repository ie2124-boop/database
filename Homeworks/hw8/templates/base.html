<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treble Clef</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  </head>
  <body>
    <header>
      <div id="leftHeader">
        <a href="{{ url_for('home') }}">
          <img src="{{ url_for('static', filename='images/misc/treble-clef-logo.jpg') }}" alt="Treble Clef logo">
        </a>
      </div>

      <div id="midHeader">
        <form id="searchBoxForm" action="{{ url_for('search') }}" method="post">
          <input id="searchBox" type="text" placeholder="Search by book title…" name="search">
          <input id="searchIcon" type="image" src="{{ url_for('static', filename='images/misc/search-icon.png') }}" alt="search">
        </form>

        <div class="dropdown">
          <p class="dropdownSelect">Browse Categories ▾</p>
          <div class="dropdownContent">
            {% for category in categories %}
              <a href="{{ url_for('category', categoryId=category['categoryId']) }}">
                {{ category['categoryName'] }}
              </a>
            {% endfor %}
          </div>
        </div>
      </div>

      <div id="rightHeader">
        <div id="cartIcon">
          <a href="#">
            <img src="{{ url_for('static', filename='images/misc/cart-icon.jpg') }}" alt="cart">
          </a>
        </div>
        <div id="cartCount">0 items</div>
        <div class="loginButton"><a href="#">Login</a></div>
        <div class="adminButton"><a href="{{ url_for('read') }}">Manage Books</a></div>
      </div>
    </header>

    {% block container %}{% endblock %}

    <footer>
      <div id="footerLeft">
        <p>The Treble Clef</p>
        <span style="color:rgba(255,255,255,0.2);">|</span>
        <a href="#">Contact Us</a>
        <a href="#">Directions</a>
        <a href="#">&copy; 2025</a>
      </div>
      <div id="footerRight">
        <a href="#"><img src="{{ url_for('static', filename='images/misc/facebook-icon.jpg') }}" alt="Facebook"></a>
        <a href="#"><img src="{{ url_for('static', filename='images/misc/twitter-icon.jpg') }}" alt="Twitter"></a>
      </div>
    </footer>
  </body>
</html>
