{% extends 'base.html' %}
{% block container %}
<div id="formPage">
    <h1>Add a New Book</h1>
    <p class="formSubtitle">Fill in the details below to add a book to the inventory.</p>

    <div class="formCard">
        <form method="POST" action="{{ url_for('create_post') }}">

            <div class="formRow">
                <div class="formGroup">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Book title" required>
                </div>
                <div class="formGroup">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" placeholder="Author name" required>
                </div>
            </div>

            <div class="formRow">
                <div class="formGroup">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn" placeholder="13-9780000000000" required>
                </div>
                <div class="formGroup">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00" required>
                </div>
            </div>

            <div class="formRow">
                <div class="formGroup">
                    <label for="image">Image Filename</label>
                    <input type="text" id="image" name="image" placeholder="example.jpg" required>
                </div>
                <div class="formGroup">
                    <label for="categoryId">Category</label>
                    <select id="categoryId" name="categoryId" required>
                        {% for cat in categories %}
                            <option value="{{ cat['categoryId'] }}">{{ cat['categoryName'] }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="formDivider"></div>

            <div class="toggleGroup">
                <label>Read Now</label>
                <label class="toggle">
                    <input type="checkbox" name="readNow" value="1">
                    <span class="toggleSlider"></span>
                </label>
                <span class="toggleLabel">Allow customers to read this book online</span>
            </div>

            <div class="formDivider"></div>

            <div class="formActions">
                <button type="submit" class="btnPrimary">Add Book</button>
                <a href="{{ url_for('read') }}" class="btnSecondary">Cancel</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
