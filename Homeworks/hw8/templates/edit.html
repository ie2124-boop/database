{% extends 'base.html' %}
{% block container %}
<div id="formPage">
    <h1>Edit Book</h1>
    <p class="formSubtitle">Update the details for <em>{{ book['title'] }}</em>.</p>

    <div class="formCard">
        <form method="POST" action="{{ url_for('edit_post', book_id=book['bookId']) }}">

            <div class="formRow">
                <div class="formGroup">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" value="{{ book['title'] }}" required>
                </div>
                <div class="formGroup">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" value="{{ book['author'] }}" required>
                </div>
            </div>

            <div class="formRow">
                <div class="formGroup">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" name="isbn" value="{{ book['isbn'] }}" required>
                </div>
                <div class="formGroup">
                    <label for="price">Price ($)</label>
                    <input type="number" id="price" name="price" step="0.01" min="0" value="{{ book['price'] }}" required>
                </div>
            </div>

            <div class="formRow">
                <div class="formGroup">
                    <label for="image">Image Filename</label>
                    <input type="text" id="image" name="image" value="{{ book['image'] }}" required>
                </div>
                <div class="formGroup">
                    <label for="categoryId">Category</label>
                    <select id="categoryId" name="categoryId" required>
                        {% for cat in categories %}
                            <option value="{{ cat['categoryId'] }}"
                                {% if cat['categoryId'] == book['categoryId'] %}selected{% endif %}>
                                {{ cat['categoryName'] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="formDivider"></div>

            <div class="toggleGroup">
                <label>Read Now</label>
                <label class="toggle">
                    <input type="checkbox" name="readNow" value="1"
                        {% if book['readNow'] == 1 %}checked{% endif %}>
                    <span class="toggleSlider"></span>
                </label>
                <span class="toggleLabel">Allow customers to read this book online</span>
            </div>

            <div class="formDivider"></div>

            <div class="formActions">
                <button type="submit" class="btnPrimary">Save Changes</button>
                <a href="{{ url_for('read') }}" class="btnSecondary">Cancel</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
